name: Publish

on:
  push:
    branches: [main]
    paths:
      - packages/create-skaff/**
      - .github/workflows/publish.yml

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: packages/create-skaff
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
        working-directory: .

      - run: bun run typecheck

      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          highest_tag=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          published=$(npm view create-skaff version 2>/dev/null || echo 0.0.0)
          version=$(node -p "
            const parse = (v) => v.split('.').map(Number);
            const highest = ['$highest_tag', '$published', require('./package.json').version]
              .filter(Boolean).map(parse)
              .sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]).at(-1);
            [highest[0], highest[1], highest[2] + 1].join('.')
          ")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          npm pkg set version="$version"
          git add package.json
          git commit -m "Release v$version"
          git tag -a "v$version" -m "Release v$version"

      - run: bun run build

      - run: npm publish

      - run: git push --follow-tags
